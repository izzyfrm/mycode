<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mycode</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: calc(100% - 40px);
  max-width: 900px;
  margin: clamp(28px, 7vw, 70px) auto;
}

header {
  margin-bottom: 35px;
}

.logo {
  font-size: 24px;
  font-weight: 700;
}

.logo span {
  color: #999;
}

.subtitle {
  margin-top: 8px;
  color: #999;
  font-size: 14px;
}

.editor {
  background: #050505;
  border: 1px solid #222;
  border-radius: 8px;
  overflow: hidden;
}

.editor-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 15px;
  border-bottom: 1px solid #1c1c1c;
  font-size: 13px;
  color: #999;
}

textarea {
  width: 100%;
  display: block;
  height: 340px;
  min-height: 200px;
  padding: 18px;
  border: 0;
  outline: none;
  resize: vertical;

  background: #050505;
  color: #ddd;

  font-family: Consolas, "Courier New", monospace;
  font-size: 14px;
  line-height: 1.6;
}

.actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}

button {
  border: 1px solid #292929;
  background: #111;
  color: #eee;

  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}

button:hover {
  background: #181818;
}

.clear {
  color: #888;
}

.results {
  margin-top: 35px;
  padding-top: 25px;
  border-top: 1px solid #222;
}

.results h2 {
  margin: 0 0 18px;
  font-size: 16px;
}

.language-bar {
  display: flex;
  width: 100%;
  height: 8px;
  overflow: hidden;
  border-radius: 10px;
  background: #111;
  margin-bottom: 15px;
}

.language-segment {
  height: 100%;
}

.language-list {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.language {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.percent {
  color: #888;
}

.empty {
  color: #999;
  font-size: 13px;
}

footer {
  margin-top: 50px;
  padding-top: 20px;
  border-top: 1px solid #181818;

  color: #888;
  font-size: 12px;
}

html { color-scheme: dark; }
body { line-height: 1.5; }
header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
h1 { margin: 0; letter-spacing: -0.8px; }
nav { display: flex; gap: 4px; padding: 4px; border: 1px solid #222; border-radius: 8px; }
nav a { padding: 7px 12px; color: #999; text-decoration: none; font-size: 13px; border-radius: 5px; }
nav a:hover, nav a[aria-current="page"] { background: #181818; color: #f5f5f5; }
button, nav a { min-height: 40px; }
button:focus-visible, a:focus-visible { outline: 2px solid #aaa; outline-offset: 4px; }
.editor:focus-within { border-color: #888; }
.editor-top { background: #0c0c0c; }
textarea::placeholder { color: #777; }
.actions { align-items: center; flex-wrap: wrap; }
.primary { background: #e6e6e6; border-color: #e6e6e6; color: #111; font-weight: 600; }
.primary:hover { background: #fff; }
button:disabled { opacity: 0.4; cursor: default; }
.hint, .result-note { color: #999; font-size: 12px; }
.hint { margin-left: auto; }
.result-note { margin: -8px 0 20px; }
.language { padding: 8px 10px; border: 1px solid #222; border-radius: 6px; }
.dot { flex-shrink: 0; }
[hidden] { display: none !important; }
@media (max-width: 540px) {
  header { align-items: flex-start; flex-direction: column; gap: 18px; margin-bottom: 24px; }
  textarea { height: 300px; padding: 14px; font-size: 16px; }
  .hint { width: 100%; margin: 4px 0 0; }
  .language-list { gap: 8px; }
  footer { margin-top: 32px; }
}
</style>
</head>

<body>

<main class="container">

  <header>
    <div>
      <h1 class="logo">my<label for="code">code</label></h1>
      <div class="subtitle">
        Paste code. See what it's made of.
      </div>
    </div>
    <nav aria-label="Tools">
      <a href="index.html" aria-current="page">Languages</a>
      <a href="errors.html">Errors</a>
    </nav>
  </header>

  <div class="editor">

    <div class="editor-top">
      <label for="code">code</label>
      <span id="lineCount">0 lines</span>
    </div>

    <textarea
      id="code"
      spellcheck="false"
      autocapitalize="off"
      autocomplete="off"
      autocorrect="off"
      aria-describedby="editorHint"
      placeholder="// paste your code here..."
    ></textarea>

  </div>

  <div class="actions">
    <button class="primary" id="runButton" type="button" onclick="analyze()" disabled>Analyze</button>
    <button type="button" class="clear" onclick="clearCode()">Clear</button>
    <span class="hint" id="editorHint">Ctrl / ⌘ + Enter to analyze</span>
  </div>

  <div class="results" id="results" role="status" aria-live="polite" hidden>

    <h2>Languages</h2>
    <p class="result-note">Estimates based on syntax matches, not exact proportions of your code.</p>

    <div class="language-bar" id="languageBar"></div>

    <div class="language-list" id="languageList"></div>

  </div>

  <footer>
    mycode / code stays in your browser
  </footer>

</main>

<script>
const codeBox = document.getElementById("code");
const results = document.getElementById("results");
const languageBar = document.getElementById("languageBar");
const languageList = document.getElementById("languageList");
const lineCount = document.getElementById("lineCount");

const languages = {
  TypeScript: {
    color: "#3178c6",
    signals: [
      [/\binterface\s+\w+/g, 3],
      [/\btype\s+\w+\s*=/g, 3],
      [/\benum\s+\w+/g, 3],
      [/\bimplements\s+\w+/g, 3],
      [/:\s*(string|number|boolean|void|unknown|any)\b/g, 2],
      [/\bas\s+const\b/g, 2],
      [/<\w+>\(/g, 1]
    ]
  },
  JavaScript: {
    color: "#f1e05a",
    signals: [
      [/\bconst\s+\w+\s*=/g, 2],
      [/\blet\s+\w+\s*=/g, 2],
      [/=>\s*\{?/g, 2],
      [/\bconsole\.\w+\(/g, 2],
      [/\bdocument\.\w+/g, 2],
      [/\brequire\(['"]/g, 2],
      [/\bimport .* from ['"]/g, 2],
      [/\bfunction\s*\w*\(/g, 1]
    ]
  },
  HTML: {
    color: "#e34c26",
    signals: [
      [/<!DOCTYPE html>/gi, 3],
      [/<\/?(html|head|body|div|span|button|script|section|header|footer)\b/gi, 1]
    ]
  },
  CSS: {
    color: "#563d7c",
    signals: [
      [/[.#][a-zA-Z0-9_-]+\s*\{/g, 2],
      [/@media\s*\(/g, 3],
      [/(background|color|display|margin|padding|font-family)\s*:/g, 1]
    ]
  },
  Python: {
    color: "#3572A5",
    signals: [
      [/\bdef\s+\w+\(.*\):/g, 3],
      [/\bself\b/g, 2],
      [/\b__name__\b/g, 3],
      [/\belif\b/g, 3],
      [/\bimport\s+\w+/g, 1],
      [/\bprint\(/g, 1],
      [/\bclass\s+\w+.*:/g, 2]
    ]
  },
  JSON: {
    color: "#aaaaaa",
    signals: [
      [/^\s*\{/g, 1],
      [/"[^"]+"\s*:\s*("[^"]*"|\d|true|false|null|\[|\{)/g, 2]
    ]
  },
  SQL: {
    color: "#e38c00",
    signals: [
      [/\bSELECT\b.*\bFROM\b/gi, 3],
      [/\bINSERT INTO\b/gi, 3],
      [/\bCREATE TABLE\b/gi, 3],
      [/\bWHERE\b/gi, 1],
      [/\bJOIN\b/gi, 1],
      [/\bGROUP BY\b/gi, 2]
    ]
  },
  Java: {
    color: "#b07219",
    signals: [
      [/\bpublic\s+static\s+void\s+main\b/g, 3],
      [/\bpublic\s+class\s+\w+/g, 3],
      [/\bSystem\.out\.print/g, 3],
      [/\bimport\s+java\./g, 3],
      [/\bnew\s+\w+\(/g, 1],
      [/\bthrows\s+\w+/g, 2]
    ]
  },
  "C++": {
    color: "#f34b7d",
    signals: [
      [/#include\s*<\w+>/g, 2],
      [/\bstd::/g, 3],
      [/\bcout\s*<</g, 3],
      [/\bcin\s*>>/g, 3],
      [/\btemplate\s*</g, 3],
      [/\bnullptr\b/g, 3]
    ]
  },
  C: {
    color: "#555555",
    signals: [
      [/#include\s*<\w+\.h>/g, 3],
      [/\bprintf\(/g, 2],
      [/\bscanf\(/g, 3],
      [/\bmalloc\(/g, 3],
      [/\bstruct\s+\w+\s*\{/g, 2],
      [/\bint\s+main\(/g, 1]
    ]
  },
  "C#": {
    color: "#178600",
    signals: [
      [/\busing System\b/g, 3],
      [/\bConsole\.Write/g, 3],
      [/\bnamespace\s+\w+/g, 2],
      [/\bpublic\s+(class|void|static)\b/g, 1],
      [/\{\s*get;\s*set;\s*\}/g, 3]
    ]
  },
  Go: {
    color: "#00ADD8",
    signals: [
      [/\bpackage\s+main\b/g, 3],
      [/\bfunc\s+\w+\(/g, 2],
      [/\bfmt\.\w+/g, 3],
      [/:=/g, 2],
      [/\bgo\s+func\b/g, 3]
    ]
  },
  Rust: {
    color: "#dea584",
    signals: [
      [/\bfn\s+\w+\(/g, 3],
      [/\blet\s+mut\b/g, 3],
      [/\bimpl\s+\w+/g, 3],
      [/\bmatch\s+\w+\s*\{/g, 2],
      [/\bprintln!\(/g, 3],
      [/\buse\s+std::/g, 2]
    ]
  },
  PHP: {
    color: "#4F5D95",
    signals: [
      [/<\?php/g, 3],
      [/\$\w+\s*=/g, 2],
      [/\becho\b/g, 2],
      [/->/g, 1],
      [/\bfunction\s+\w+\(/g, 1]
    ]
  },
  Ruby: {
    color: "#701516",
    signals: [
      [/\bdef\s+\w+/g, 2],
      [/\bend\b/g, 1],
      [/\bputs\b/g, 3],
      [/\battr_accessor\b/g, 3],
      [/\bmodule\s+\w+/g, 2],
      [/\bdo\s*\|.*\|/g, 3]
    ]
  },
  Swift: {
    color: "#F05138",
    signals: [
      [/\bfunc\s+\w+\(/g, 2],
      [/\bvar\s+\w+\s*:\s*\w+/g, 2],
      [/\bimport\s+(UIKit|SwiftUI|Foundation)\b/g, 3],
      [/\bguard\s+let\b/g, 3],
      [/\bstruct\s+\w+\s*:/g, 2]
    ]
  },
  Kotlin: {
    color: "#A97BFF",
    signals: [
      [/\bfun\s+\w+\(/g, 3],
      [/\bval\s+\w+\s*[:=]/g, 2],
      [/\bwhen\s*\(/g, 2],
      [/\bcompanion object\b/g, 3],
      [/\bdata class\b/g, 3]
    ]
  },
  Shell: {
    color: "#89e051",
    signals: [
      [/^#!.*\b(bash|sh|zsh)\b/gm, 3],
      [/\bfi\b/g, 2],
      [/\bdone\b/g, 2],
      [/\$\{[^}]+\}/g, 1],
      [/\bexport\s+\w+=/g, 2],
      [/\bif\s*\[\s/g, 2]
    ]
  },
  YAML: {
    color: "#cb171e",
    signals: [
      [/^---\s*$/gm, 3],
      [/^\s*-\s+\w[\w-]*:/gm, 2],
      [/^[\w-]+:\s*$/gm, 1]
    ]
  },
  Markdown: {
    color: "#083fa1",
    signals: [
      [/^#{1,6}\s+\S/gm, 3],
      [/\*\*[^*]+\*\*/g, 1],
      [/^\s*[-*]\s+\S/gm, 1],
      [/\[[^\]]+\]\([^)]+\)/g, 2]
    ]
  },
  XML: {
    color: "#0060ac",
    signals: [
      [/<\?xml/gi, 3],
      [/xmlns:/g, 3],
      [/<\/\w+>/g, 1]
    ]
  },
  Dart: {
    color: "#00B4AB",
    signals: [
      [/\bvoid\s+main\(/g, 2],
      [/\bimport\s+'package:/g, 3],
      [/\bWidget\s+build\(/g, 3],
      [/\bStatelessWidget\b/g, 3],
      [/\bStatefulWidget\b/g, 3]
    ]
  },
  Scala: {
    color: "#c22d40",
    signals: [
      [/\bobject\s+\w+\s+extends\b/g, 3],
      [/\bval\s+\w+\s*=/g, 1],
      [/\bcase class\b/g, 3],
      [/\bimport\s+scala\./g, 3]
    ]
  },
  R: {
    color: "#198CE7",
    signals: [
      [/<-\s*function\(/g, 3],
      [/\blibrary\(/g, 2],
      [/\bggplot\(/g, 3],
      [/<-\s*c\(/g, 2]
    ]
  },
  Perl: {
    color: "#0298c3",
    signals: [
      [/\buse strict\b/g, 3],
      [/\buse warnings\b/g, 3],
      [/\bmy\s+\$\w+/g, 2],
      [/\bsub\s+\w+\s*\{/g, 2]
    ]
  },
  Lua: {
    color: "#000080",
    signals: [
      [/\blocal\s+\w+\s*=/g, 2],
      [/\bfunction\s+\w+\(/g, 1],
      [/\brequire\(['"]/g, 1],
      [/\bnil\b/g, 2]
    ]
  },
  Haskell: {
    color: "#5e5086",
    signals: [
      [/::\s*\w+\s*->/g, 3],
      [/\bmodule\s+\w+\s+where\b/g, 3],
      [/\bimport\s+Data\./g, 2],
      [/\bdata\s+\w+\s*=/g, 2]
    ]
  },
  "Objective-C": {
    color: "#438eff",
    signals: [
      [/#import\s*<\w+\/\w+\.h>/g, 3],
      [/@interface\b/g, 3],
      [/@implementation\b/g, 3],
      [/\[\w+\s+\w+\]/g, 1],
      [/\bNSLog\(/g, 3]
    ]
  },
  Dockerfile: {
    color: "#384d54",
    signals: [
      [/^FROM\s+\S+/gm, 3],
      [/^RUN\s+/gm, 2],
      [/^COPY\s+/gm, 2],
      [/^WORKDIR\s+/gm, 2],
      [/^EXPOSE\s+\d+/gm, 3],
      [/^ENTRYPOINT\s+/gm, 3]
    ]
  },
  GraphQL: {
    color: "#e10098",
    signals: [
      [/\btype\s+\w+\s*\{/g, 2],
      [/\bquery\s+\w*\s*\{/g, 3],
      [/\bmutation\s+\w*\s*\{/g, 3],
      [/\bfragment\s+\w+\s+on\b/g, 3]
    ]
  }
};

function updateEditor() {
  const lines = codeBox.value ? codeBox.value.split("\n").length : 0;
  lineCount.textContent = `${lines} ${lines === 1 ? "line" : "lines"}`;
  document.getElementById("runButton").disabled = !codeBox.value.trim();
  results.hidden = true;
}

codeBox.addEventListener("input", updateEditor);
codeBox.addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
    event.preventDefault();
    analyze();
  }
});
updateEditor();

function analyze() {
  const code = codeBox.value;

  if (!code.trim()) return;

  let scores = {};
  let total = 0;

  for (const [language, data] of Object.entries(languages)) {

    let score = 0;

    data.signals.forEach(([pattern, weight]) => {
      const matches = code.match(pattern);

      if (matches) {
        score += matches.length * weight;
      }
    });

    if (score > 0) {
      scores[language] = score;
      total += score;
    }
  }

  languageBar.innerHTML = "";
  languageList.innerHTML = "";

  if (!total) {
    languageList.innerHTML =
      '<div class="empty">No language detected.</div>';

    results.hidden = false;
    return;
  }

  const filtered = Object.entries(scores)
    .filter(([, score]) => score / total >= 0.03);

  const filteredTotal = filtered.reduce((sum, [, s]) => sum + s, 0);

  const sorted = filtered.sort((a, b) => b[1] - a[1]);

  sorted.forEach(([language, score]) => {

    const percentage =
      ((score / filteredTotal) * 100).toFixed(1);

    const color = languages[language].color;

    const segment = document.createElement("div");

    segment.className = "language-segment";
    segment.style.width = percentage + "%";
    segment.style.background = color;

    languageBar.appendChild(segment);

    const item = document.createElement("div");

    item.className = "language";

    item.innerHTML = `
      <span class="dot" style="background:${color}"></span>
      <strong>${language}</strong>
      <span class="percent">${percentage}%</span>
    `;

    languageList.appendChild(item);
  });

  results.hidden = false;
}

function clearCode() {
  codeBox.value = "";
  updateEditor();
  codeBox.focus();
}
</script>

</body>
</html>
