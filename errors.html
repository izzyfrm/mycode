<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>myerrors</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: calc(100% - 40px);
  max-width: 900px;
  margin: clamp(28px, 7vw, 70px) auto;
}

header {
  margin-bottom: 35px;
}

.logo {
  font-size: 24px;
  font-weight: 700;
}

.logo span {
  color: #999;
}

.subtitle {
  margin-top: 8px;
  color: #999;
  font-size: 14px;
}

.editor {
  background: #050505;
  border: 1px solid #222;
  border-radius: 8px;
  overflow: hidden;
}

.editor-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 15px;
  border-bottom: 1px solid #1c1c1c;
  font-size: 13px;
  color: #999;
}

textarea {
  width: 100%;
  display: block;
  height: 340px;
  min-height: 200px;
  padding: 18px;
  border: 0;
  outline: none;
  resize: vertical;

  background: #050505;
  color: #ddd;

  font-family: Consolas, "Courier New", monospace;
  font-size: 14px;
  line-height: 1.6;
}

.actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}

button {
  border: 1px solid #292929;
  background: #111;
  color: #eee;

  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}

button:hover {
  background: #181818;
}

.clear {
  color: #888;
}

.results {
  margin-top: 35px;
  padding-top: 25px;
  border-top: 1px solid #222;
}

.results h2 {
  margin: 0 0 18px;
  font-size: 16px;
}

.summary {
  display: flex;
  gap: 18px;
  margin-bottom: 20px;
  font-size: 13px;
}

.summary-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.summary-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.dot-error { background: #ff4d4d; }
.dot-warn  { background: #f1c40f; }
.dot-clean { background: #2ecc71; }

.issue-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.issue {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid #1c1c1c;
  border-radius: 6px;
  background: #0a0a0a;
}

.issue-badge {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  height: fit-content;
  white-space: nowrap;
}

.badge-error {
  background: rgba(255, 77, 77, 0.15);
  color: #ff6b6b;
}

.badge-warn {
  background: rgba(241, 196, 15, 0.15);
  color: #f1c40f;
}

.issue-body {
  font-size: 13px;
}

.issue-line {
  color: #999;
  font-size: 12px;
  margin-bottom: 3px;
  display: block;
  padding: 0;
  min-height: 28px;
  border: 0;
  background: transparent;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.issue-msg {
  color: #ddd;
}

.clean-msg {
  color: #2ecc71;
  font-size: 13px;
}

footer {
  margin-top: 50px;
  padding-top: 20px;
  border-top: 1px solid #181818;

  color: #888;
  font-size: 12px;
}

html { color-scheme: dark; }
body { line-height: 1.5; }
header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
h1 { margin: 0; letter-spacing: -0.8px; }
nav { display: flex; gap: 4px; padding: 4px; border: 1px solid #222; border-radius: 8px; }
nav a { padding: 7px 12px; color: #999; text-decoration: none; font-size: 13px; border-radius: 5px; }
nav a:hover, nav a[aria-current="page"] { background: #181818; color: #f5f5f5; }
button, nav a { min-height: 40px; }
button:focus-visible, a:focus-visible { outline: 2px solid #aaa; outline-offset: 4px; }
.editor:focus-within { border-color: #888; }
.editor-top { background: #0c0c0c; }
textarea::placeholder { color: #777; }
.actions { align-items: center; flex-wrap: wrap; }
.primary { background: #e6e6e6; border-color: #e6e6e6; color: #111; font-weight: 600; }
.primary:hover { background: #fff; }
button:disabled { opacity: 0.4; cursor: default; }
.hint, .result-note { color: #999; font-size: 12px; }
.hint { margin-left: auto; }
.result-note { margin: -8px 0 20px; }
.summary { flex-wrap: wrap; }
.issue-body { min-width: 0; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
@media (max-width: 540px) {
  header { align-items: flex-start; flex-direction: column; gap: 18px; margin-bottom: 24px; }
  textarea { height: 300px; padding: 14px; font-size: 16px; }
  .hint { width: 100%; margin: 4px 0 0; }
  .issue { flex-direction: column; gap: 8px; }
  .issue-badge { align-self: flex-start; }
  footer { margin-top: 32px; }
}
</style>
</head>

<body>

<main class="container">

  <header>
    <div>
      <h1 class="logo">my<span>errors</span></h1>
      <div class="subtitle">
        Paste code. Find what's broken.
      </div>
    </div>
    <nav aria-label="Tools">
      <a href="index.html">Languages</a>
      <a href="errors.html" aria-current="page">Errors</a>
    </nav>
  </header>

  <div class="editor">

    <div class="editor-top">
      <label for="code">code</label>
      <span id="lineCount">0 lines</span>
    </div>

    <textarea
      id="code"
      spellcheck="false"
      autocapitalize="off"
      autocomplete="off"
      autocorrect="off"
      aria-describedby="editorHint"
      placeholder="// paste your code here..."
    ></textarea>

  </div>

  <div class="actions">
    <button class="primary" id="runButton" type="button" onclick="check()" disabled>Check</button>
    <button type="button" class="clear" onclick="clearCode()">Clear</button>
    <span class="hint" id="editorHint">Ctrl / ⌘ + Enter to check</span>
  </div>

  <div class="results" id="results" role="status" aria-live="polite" hidden>

    <h2>Issues</h2>
    <p class="result-note">Lightweight checks for common mistakes, not a full syntax validator.</p>

    <div class="summary" id="summary"></div>

    <div class="issue-list" id="issueList"></div>

  </div>

  <footer>
    myerrors / code stays in your browser
  </footer>

</main>

<script>
const codeBox = document.getElementById("code");
const results = document.getElementById("results");
const summary = document.getElementById("summary");
const issueList = document.getElementById("issueList");
const lineCount = document.getElementById("lineCount");

function updateEditor() {
  const lines = codeBox.value ? codeBox.value.split("\n").length : 0;
  lineCount.textContent = `${lines} ${lines === 1 ? "line" : "lines"}`;
  document.getElementById("runButton").disabled = !codeBox.value.trim();
  results.hidden = true;
}

codeBox.addEventListener("input", updateEditor);
codeBox.addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
    event.preventDefault();
    check();
  }
});
updateEditor();

function lineOf(code, index) {
  return code.slice(0, index).split("\n").length;
}

// Characters after which a following '/' is almost always the start of a
// regex literal rather than a division operator. Used only as a heuristic.
const REGEX_PRECEDERS = new Set([
  "(", "[", "{", ",", ";", ":", "=", "!", "&", "|", "?", "+", "-",
  "*", "%", "^", "~", "<", ">"
]);
const REGEX_PRECEDING_WORDS = new Set([
  "return", "typeof", "instanceof", "in", "of", "new", "delete",
  "void", "throw", "case", "do", "else", "yield", "await"
]);

/**
 * Single pass over the code that:
 *  - blanks out comments, strings, and (heuristically) regex literals so
 *    later checks don't get confused by brackets/quotes/keywords inside them
 *  - reports real syntax problems it notices along the way (unterminated
 *    strings/comments), instead of guessing from raw text line-by-line
 * Blanked characters are replaced with spaces (or kept as newlines) so that
 * line numbers and column positions stay identical to the original source.
 */
function analyzeCode(code, language = "javascript") {
  let out = "";
  let i = 0;
  let inString = null;
  let stringStartIndex = -1;
  let inLineComment = false;
  let inBlockComment = false;
  let blockCommentStartIndex = -1;
  const issues = [];

  function lastWord() {
    // last run of letters emitted so far, ignoring trailing whitespace
    const m = out.match(/([A-Za-z_$][A-Za-z0-9_$]*)\s*$/);
    return m ? m[1] : "";
  }

  function lastNonSpaceChar() {
    for (let k = out.length - 1; k >= 0; k--) {
      if (!/\s/.test(out[k])) return out[k];
    }
    return "";
  }

  while (i < code.length) {
    const c = code[i];
    const next = code[i + 1];

    if (inLineComment) {
      if (c === "\n") { inLineComment = false; out += c; }
      else out += " ";
      i++; continue;
    }

    if (inBlockComment) {
      if (c === "*" && next === "/") { inBlockComment = false; out += "  "; i += 2; continue; }
      out += c === "\n" ? "\n" : " ";
      i++; continue;
    }

    if (inString) {
      if (c === "\\") {
        out += " ";
        if (next !== undefined) out += next === "\n" ? "\n" : " ";
        i += next === undefined ? 1 : 2;
        continue;
      }
      if (c === "\n") {
        if (inString === "`" || inString.length === 3) {
          // Templates and Python triple-quoted strings may span lines.
          out += "\n";
          i++; continue;
        }
        issues.push({
          type: "error",
          line: lineOf(code, stringStartIndex),
          message: `Unterminated ${inString === "`" ? "template" : inString[0] === '"' ? "double" : "single"}-quoted string starting here`
        });
        inString = null;
        // don't consume the newline as part of the string
        continue;
      }
      if (code.startsWith(inString, i)) {
        out += " ".repeat(inString.length);
        i += inString.length;
        inString = null;
        continue;
      }
      out += " ";
      i++; continue;
    }

    if (c === "/" && next === "/" && language !== "python") { inLineComment = true; out += "  "; i += 2; continue; }
    if (c === "/" && next === "*" && language !== "python") {
      inBlockComment = true;
      blockCommentStartIndex = i;
      out += "  "; i += 2; continue;
    }
    if (c === "#" && language === "python") { inLineComment = true; out += " "; i += 1; continue; }

    if (c === "'" || c === '"' || c === "`") {
      inString = language === "python" && code.startsWith(c.repeat(3), i) ? c.repeat(3) : c;
      stringStartIndex = i;
      out += " ".repeat(inString.length); i += inString.length; continue;
    }

    // Heuristic regex-literal detection so patterns like /\(/ or /[{}]/
    // don't get mistaken for real brackets.
    if (c === "/" && language !== "python") {
      const prevChar = lastNonSpaceChar();
      const prevWord = lastWord();
      const looksLikeRegexStart =
        prevChar === "" ||
        REGEX_PRECEDERS.has(prevChar) ||
        REGEX_PRECEDING_WORDS.has(prevWord);

      if (looksLikeRegexStart) {
        let j = i + 1;
        let sawContent = false;
        let closed = false;
        while (j < code.length && code[j] !== "\n") {
          if (code[j] === "\\") { j += 2; sawContent = true; continue; }
          if (code[j] === "[") {
            // character class: '/' inside it doesn't end the regex
            j++;
            while (j < code.length && code[j] !== "]" && code[j] !== "\n") {
              j += code[j] === "\\" && code[j + 1] !== "\n" ? 2 : 1;
            }
            if (code[j] !== "]") break;
            j++;
            sawContent = true;
            continue;
          }
          if (code[j] === "/") { closed = true; j++; break; }
          sawContent = true;
          j++;
        }
        if (closed && sawContent) {
          // consume optional flags
          while (j < code.length && /[a-z]/i.test(code[j])) j++;
          out += " ".repeat(j - i);
          i = j;
          continue;
        }
        // didn't look like a real regex after all — fall through as division
      }
    }

    out += c;
    i++;
  }

  if (inBlockComment) {
    issues.push({
      type: "error",
      line: lineOf(code, blockCommentStartIndex),
      message: "Unterminated block comment /* ... */ starting here"
    });
  }
  if (inString) {
    issues.push({
      type: "error",
      line: lineOf(code, stringStartIndex),
      message: `Unterminated ${inString === "`" ? "template" : inString[0] === '"' ? "double" : "single"}-quoted string starting here`
    });
  }

  return { clean: out, issues };
}

function detectLanguage(code) {
  if (/^\s*(?:<!DOCTYPE html>|<[a-z][\w-]*(?:\s|>|\/))/i.test(code)) return "html";
  if (/^\s*(?:def\s+\w+\s*\(|class\s+\w+[^\n]*:|from\s+\w+.*\s+import\s|import\s+[\w.]+\s*$|print\s*\()/m.test(code)) return "python";
  if (/\binterface\s+\w+|\btype\s+\w+\s*=|\benum\s+\w+/.test(code)) return "typescript";
  if (/\bfunction\b|=>|\bconst\b|\blet\b|console\./.test(code)) return "javascript";
  return "generic";
}

function checkBrackets(clean) {
  const pairs = { "(": ")", "[": "]", "{": "}" };
  const closers = { ")": "(", "]": "[", "}": "{" };
  const stack = [];
  const issues = [];

  for (let i = 0; i < clean.length; i++) {
    const c = clean[i];
    if (pairs[c]) {
      stack.push({ char: c, index: i });
    } else if (closers[c]) {
      if (stack.length === 0 || stack[stack.length - 1].char !== closers[c]) {
        issues.push({
          type: "error",
          line: lineOf(clean, i),
          message: `Unexpected closing '${c}' with no matching '${closers[c]}'`
        });
      } else {
        stack.pop();
      }
    }
  }

  stack.forEach(open => {
    issues.push({
      type: "error",
      line: lineOf(clean, open.index),
      message: `Unclosed '${open.char}' — never closed with '${pairs[open.char]}'`
    });
  });

  return issues;
}

// Strips <!-- comments --> and the contents of <script>/<style> blocks
// (replacing with spaces, preserving newlines) so tag matching doesn't
// get confused by JS/CSS that happens to contain '<' or '>'.
function stripHtmlNoise(raw) {
  let out = "";
  let i = 0;

  while (i < raw.length) {
    if (raw.startsWith("<!--", i)) {
      const end = raw.indexOf("-->", i + 4);
      const stop = end === -1 ? raw.length : end + 3;
      for (let k = i; k < stop; k++) out += raw[k] === "\n" ? "\n" : " ";
      i = stop;
      continue;
    }

    const scriptMatch = /^<script\b[^>]*>/i.exec(raw.slice(i));
    if (scriptMatch) {
      out += scriptMatch[0];
      i += scriptMatch[0].length;
      const end = raw.slice(i).search(/<\/script\s*>/i);
      const stop = end === -1 ? raw.length : i + end;
      for (let k = i; k < stop; k++) out += raw[k] === "\n" ? "\n" : " ";
      i = stop;
      continue;
    }

    const styleMatch = /^<style\b[^>]*>/i.exec(raw.slice(i));
    if (styleMatch) {
      out += styleMatch[0];
      i += styleMatch[0].length;
      const end = raw.slice(i).search(/<\/style\s*>/i);
      const stop = end === -1 ? raw.length : i + end;
      for (let k = i; k < stop; k++) out += raw[k] === "\n" ? "\n" : " ";
      i = stop;
      continue;
    }

    out += raw[i];
    i++;
  }

  return out;
}

function checkHtmlTags(raw) {
  const cleaned = stripHtmlNoise(raw);
  const issues = [];
  const voidTags = new Set(["area","base","br","col","embed","hr","img","input","link","meta","param","source","track","wbr"]);
  const stack = [];
  const tagRegex = /<\/?([a-zA-Z][a-zA-Z0-9-]*)\b(?:"[^"]*"|'[^']*'|[^'">])*?>/g;
  let m;

  while ((m = tagRegex.exec(cleaned)) !== null) {
    const isClosing = m[0][1] === "/";
    const tag = m[1].toLowerCase();
    const selfClosed = /\/\s*>$/.test(m[0]) || voidTags.has(tag);
    const line = lineOf(cleaned, m.index);

    if (isClosing) {
      if (stack.length === 0) {
        issues.push({ type: "error", line, message: `Closing tag </${tag}> has no matching opening tag` });
      } else {
        const last = stack[stack.length - 1];
        if (last.tag === tag) {
          stack.pop();
        } else {
          const matchIdx = stack.map(s => s.tag).lastIndexOf(tag);
          if (matchIdx !== -1) {
            issues.push({ type: "warn", line, message: `Mismatched tag: expected </${last.tag}> before </${tag}>` });
            stack.length = matchIdx;
          } else {
            issues.push({ type: "error", line, message: `Closing tag </${tag}> doesn't match any open tag` });
          }
        }
      }
    } else if (!selfClosed) {
      stack.push({ tag, line });
    }
  }

  stack.forEach(open => {
    issues.push({ type: "error", line: open.line, message: `<${open.tag}> is never closed` });
  });

  return issues;
}

function checkPython(raw, clean) {
  const issues = [];
  const lines = raw.split("\n");
  const cleanLines = clean.split("\n");

  lines.forEach((line, idx) => {
    const trimmed = line.trim();
    const stripped = cleanLines[idx].trim();

    if (/^(if|elif|else|for|while|def|class|try|except|finally|with)\b.*[^:]$/.test(stripped) && stripped.length > 0) {
      if (!stripped.includes(":") && !/[\\,({\[]$/.test(stripped)) {
        issues.push({
          type: "warn",
          line: idx + 1,
          message: `Line looks like it should end with ':' — "${trimmed.slice(0, 50)}"`
        });
      }
    }

    // Flag only genuine mixing WITHIN this line's own leading whitespace,
    // e.g. a tab followed by a space (or vice versa) before the first
    // real character — not just "this file uses tabs somewhere".
    const leading = line.match(/^[ \t]*/)[0];
    if (/\t/.test(leading) && / /.test(leading)) {
      issues.push({
        type: "warn",
        line: idx + 1,
        message: "Mixed tabs and spaces within this line's indentation"
      });
    }
  });

  return issues;
}

function checkJs(raw, clean) {
  const issues = [];
  const rawLines = raw.split("\n");
  const cleanLines = clean.split("\n");

  rawLines.forEach((line, idx) => {
    // Use the noise-stripped version of this line for detection so we
    // don't flag '==', 'var', etc. when they appear inside a string or
    // comment instead of actual code.
    const codeLine = cleanLines[idx] !== undefined ? cleanLines[idx] : line;
    const trimmed = codeLine.trim();

    if (/(^|[^=!])==(?!=)/.test(trimmed)) {
      issues.push({
        type: "warn",
        line: idx + 1,
        message: "Using '==' instead of '===' can cause unexpected type coercion"
      });
    }
    if (/\bvar\b/.test(trimmed)) {
      issues.push({
        type: "warn",
        line: idx + 1,
        message: "'var' is function-scoped and largely outdated — consider 'let' or 'const'"
      });
    }
    if (/console\.log\(/.test(trimmed)) {
      issues.push({
        type: "warn",
        line: idx + 1,
        message: "Leftover console.log — remember to remove debug statements"
      });
    }
  });

  return issues;
}

function checkGeneric(raw) {
  const issues = [];
  const lines = raw.split("\n");

  lines.forEach((line, idx) => {
    if (line.length > 120) {
      issues.push({
        type: "warn",
        line: idx + 1,
        message: `Line is ${line.length} characters — consider breaking it up`
      });
    }
    if (/\s+$/.test(line) && line.trim().length > 0) {
      issues.push({
        type: "warn",
        line: idx + 1,
        message: "Trailing whitespace"
      });
    }
  });

  return issues;
}

function dedupe(issues) {
  const seen = new Set();
  return issues.filter(issue => {
    const key = `${issue.type}|${issue.line}|${issue.message}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function selectLine(line) {
  const lines = codeBox.value.split("\n");
  const start = lines.slice(0, line - 1).reduce((total, text) => total + text.length + 1, 0);
  codeBox.focus();
  codeBox.setSelectionRange(start, start + lines[line - 1].length);
  const lineHeight = parseFloat(getComputedStyle(codeBox).lineHeight);
  codeBox.scrollTop = Math.max(0, (line - 1) * lineHeight - codeBox.clientHeight / 2);
}

function check() {
  const raw = codeBox.value;

  if (!raw.trim()) return;

  const lang = detectLanguage(raw);
  const { clean, issues: noiseIssues } = analyzeCode(raw, lang);

  let issues = [];

  if (lang !== "html") {
    issues = issues.concat(noiseIssues, checkBrackets(clean));
  }
  issues = issues.concat(checkGeneric(raw));

  if (lang === "html") {
    issues = issues.concat(checkHtmlTags(raw));
  }
  if (lang === "python") {
    issues = issues.concat(checkPython(raw, clean));
  }
  if (lang === "javascript" || lang === "typescript") {
    issues = issues.concat(checkJs(raw, clean));
  }

  issues = dedupe(issues);
  issues.sort((a, b) => a.line - b.line);

  const errorCount = issues.filter(i => i.type === "error").length;
  const warnCount = issues.filter(i => i.type === "warn").length;

  summary.innerHTML = "";
  issueList.innerHTML = "";

  if (issues.length === 0) {
    summary.innerHTML = `
      <div class="summary-item">
        <span class="summary-dot dot-clean"></span>
        No issues found
      </div>
    `;
    issueList.innerHTML = '<div class="clean-msg">Looks clean! No obvious errors detected.</div>';
    results.hidden = false;
    return;
  }

  summary.innerHTML = `
    <div class="summary-item">
      <span class="summary-dot dot-error"></span>
      ${errorCount} error${errorCount === 1 ? "" : "s"}
    </div>
    <div class="summary-item">
      <span class="summary-dot dot-warn"></span>
      ${warnCount} warning${warnCount === 1 ? "" : "s"}
    </div>
  `;

  issues.forEach(issue => {
    const el = document.createElement("div");
    el.className = "issue";

    const badgeClass = issue.type === "error" ? "badge-error" : "badge-warn";
    const badgeText = issue.type === "error" ? "ERROR" : "WARN";

    el.innerHTML = `
      <span class="issue-badge ${badgeClass}">${badgeText}</span>
      <div class="issue-body">
        <button type="button" class="issue-line" aria-label="Go to line ${issue.line}">Line ${issue.line}</button>
        <div class="issue-msg"></div>
      </div>
    `;

    el.querySelector(".issue-msg").textContent = issue.message;
    el.querySelector(".issue-line").addEventListener("click", () => selectLine(issue.line));
    issueList.appendChild(el);
  });

  results.hidden = false;
}

function clearCode() {
  codeBox.value = "";
  updateEditor();
  codeBox.focus();
}
</script>

</body>
</html>
